<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `flutter build --base-href`. The published site is
    served from a subpath (/dawaa-reference-web/), so this must not be hardcoded
    to "/" or every asset 404s.
  -->
  <base href="/dawaa-reference-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    There was no viewport tag in this file at all. The Flutter engine writes
    one of its own during boot, so the app itself was laid out correctly - but
    only from the moment the engine runs. Everything before that (the splash
    below, and the whole page if the engine fails on a slow connection) was
    rendered by Safari at its 980 px desktop assumption.

    `viewport-fit=cover` is the part the engine does NOT set, and it is what
    makes env(safe-area-inset-*) resolve to anything other than zero. Without
    it the splash and the install banner sit under the notch and the home
    indicator on an iPhone. It is re-applied after first frame, below, because
    the engine overwrites this tag wholesale.

    Zoom stays disabled, which is the engine's choice and the right one here:
    the app paints to a canvas, so a pinch would magnify pixels rather than
    re-render text, and the result is blurry rather than larger. Readable text
    has to come from a text-size setting inside the app.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="description" content="Drug reference for primary care in Egypt: conditions, adult and paediatric dosing rules, cautions, the guideline behind each dose, clinical scores, and Egyptian trade names with prices.">

  <!-- iOS home-screen behaviour. `apple-mobile-web-app-capable` is the legacy
       spelling and is still what older iOS reads; `mobile-web-app-capable` is
       the standard one. Both, because iPhones in the field are not all new. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dawaa Reference">
  <meta name="theme-color" content="#14181C">

  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dawaa Reference</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #14181C;
      /* Stops iOS rubber-band scrolling revealing white behind the canvas. */
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    /*
      The splash exists because the first visit downloads the engine and an
      8.4 MB database. Without it that is fifteen-odd seconds of blank white on
      a phone, which reads as a broken link rather than as loading - and the
      reader closes the tab before the app ever paints.
    */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #14181C;
      color: #F0EDE8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      box-sizing: border-box;
      transition: opacity .35s ease;
      z-index: 10;
    }
    #boot.gone { opacity: 0; pointer-events: none; }

    #boot .mark {
      width: 62px; height: 62px;
      border-radius: 16px;
      background: #C9683F;
      color: #14181C;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 800; letter-spacing: .5px;
    }
    #boot .name { font-size: 19px; font-weight: 700; }
    #boot .note { font-size: 13px; color: #9AA4B2; max-width: 300px; line-height: 1.45; }

    #boot .bar {
      width: 190px; height: 3px;
      border-radius: 2px;
      background: #262C34;
      overflow: hidden;
    }
    #boot .bar i {
      display: block; height: 100%; width: 40%;
      background: #C9683F;
      animation: slide 1.25s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .bar i { animation: none; width: 100%; }
    }

    /*
      "Add to Home Screen" is the only way an iPhone gets an app icon and a
      full-screen window, and Safari gives no prompt for it the way Chrome
      does - so a physician on an iPhone would never discover it. Shown only on
      iOS Safari, only when not already installed, and only once.
    */
    #ios-install {
      position: fixed;
      left: 12px; right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      border-radius: 12px;
      background: #1A2027;
      border: 1px solid #333C46;
      color: #F0EDE8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.4;
      box-shadow: 0 6px 24px rgba(0,0,0,.45);
      z-index: 9;
    }
    #ios-install.show { display: flex; }
    #ios-install b { color: #E0A37E; font-weight: 700; }
    #ios-install .x {
      flex: none;
      margin: -4px -4px 0 0;
      padding: 4px 8px;
      font-size: 18px;
      line-height: 1;
      color: #9AA4B2;
      background: none; border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">Rx</div>
    <div class="name">Dawaa Reference</div>
    <div class="bar"><i></i></div>
    <div class="note" id="boot-note">
      Loading the drug database — about 9&nbsp;MB.<br>Only on the first visit;
      after that it opens offline.
    </div>
  </div>

  <div id="ios-install">
    <div>
      Add this to your Home Screen for a full-screen app that opens offline:
      tap <b>Share</b> at the bottom of Safari, then <b>Add to Home Screen</b>.
    </div>
    <button class="x" id="ios-install-x" aria-label="Dismiss">&times;</button>
  </div>

  <script>
    (function () {
      // The engine replaces the viewport tag with its own during boot and
      // drops viewport-fit=cover with it, which silently zeroes every
      // env(safe-area-inset-*) on the page. Put it back.
      function keepSafeAreas() {
        var vp = document.querySelector('meta[name=viewport]');
        if (!vp) return;
        if (vp.content.indexOf('viewport-fit') === -1) {
          vp.content = vp.content + ', viewport-fit=cover';
        }
      }

      // Flutter fires this on window once the first frame is on screen.
      window.addEventListener('flutter-first-frame', function () {
        keepSafeAreas();
        var boot = document.getElementById('boot');
        if (boot) {
          boot.classList.add('gone');
          setTimeout(function () { boot.remove(); }, 400);
        }
        maybeOfferInstall();
      });

      // If the engine never boots, say so rather than spinning for ever. A bar
      // that animates indefinitely is indistinguishable from a hung page.
      setTimeout(function () {
        var note = document.getElementById('boot-note');
        if (note && document.getElementById('boot')) {
          note.innerHTML =
            'Still loading. On a slow connection the first visit can take a ' +
            'minute.<br>If nothing happens, reload the page.';
        }
      }, 45000);

      function isIosSafari() {
        var ua = window.navigator.userAgent;
        var iOS = /iPad|iPhone|iPod/.test(ua) ||
          // iPadOS 13+ reports as a Mac; the touch points give it away.
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var webkit = /WebKit/.test(ua);
        var otherBrowser = /CriOS|FxiOS|OPiOS|EdgiOS/.test(ua);
        return iOS && webkit && !otherBrowser;
      }

      function alreadyInstalled() {
        return window.navigator.standalone === true ||
          (window.matchMedia &&
            window.matchMedia('(display-mode: standalone)').matches);
      }

      function maybeOfferInstall() {
        if (!isIosSafari() || alreadyInstalled()) return;
        try {
          if (localStorage.getItem('dawaa-ios-install-dismissed') === '1') return;
        } catch (e) { /* private browsing blocks localStorage; show it anyway */ }

        var banner = document.getElementById('ios-install');
        if (!banner) return;
        // Not the instant the app paints - let the reader see the app first.
        setTimeout(function () { banner.classList.add('show'); }, 2500);
        document.getElementById('ios-install-x').addEventListener('click', function () {
          banner.classList.remove('show');
          try { localStorage.setItem('dawaa-ios-install-dismissed', '1'); } catch (e) {}
        });
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
